  <!-- SHOP D-->
  <div class="shop-drawer" id="shopDrawer">
    <div class="shop-header">
      <div class="shop-title">Shop</div>
      <div style="display:flex; gap:12px;">
        <button class="icon-btn" id="cartBtn" title="Cart">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"></path>
          </svg>
          <span class="cart-count">0</span>
        </button>
        <button class="icon-btn" id="closeShopBtn" title="Close">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="shop-scroll-wrap">
      <div class="shop-track" id="shopTrack">
        <!-- product cards injected by JS -->
      </div>
    </div>
  </div>

</div>

<script>
  // ---- Data for Call to Actions ---- // 
  const entries = [
    { date:"Give Today", tag:"Lorem 01", desc:"Lorem ipsum dolor sit, Amet Consec", meta:"Eiusmod Tempor, 2025" },
    { date:"Mar. 22, 2026", tag:"Lorem 02", desc:"Nullam Varius, Turpis ET", meta:"Scelerisque, 2025", struck:true },
    { date:"Mar. 23, 2026", tag:"Lorem 03", desc:"Fusce ID Dui, Sit", meta:"Tellus, 2025" },
    { date:"Aug. 3, 2026",  tag:"Lorem 04", desc:"Tristique Neque Consequat, ES", meta:"Sapien Varius Nunc, 2025" },
    { date:"Aug. 10, 2026", tag:"Lorem 05", desc:"Vestibulum Ante Ipsum", meta:"Primis In Faucibus, 2025" },
    { date:"Aug. 18, 2026", tag:"Lorem 06", desc:"Curabitur Blandit Tempus", meta:"Porttitor Nunc, 2025" }
  ];

  const entriesEl = document.getElementById('entries');
  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="entry-top">
        <span class="entry-date">${e.date}</span>
        <span class="entry-tag${e.struck ? ' struck' : ''}">${e.tag}</span>
      </div>
      <div class="entry-desc">${e.desc}<br>${e.meta}</div>
    `;
    entriesEl.appendChild(div);
  });

  // ---- Shop ---- //
  const products = [
    { name:"Heart Tee", price:"$32" },
    { name:"The Dreamer Cap", price:"$28" },
    { name:"The Dreamer Print", price:"$18" },
    { name:"Carlos Solis Magnet", price:"$6" },
    { name:"Tote Bag", price:"$22" },
    { name:"Hoodie", price:"$58" },
    { name:"Enamel Pin", price:"$12" },
    { name:"Sticker Pack", price:"$8" }
  ];

  const shopTrack = document.getElementById('shopTrack');
  products.forEach(p => {
    const div = document.createElement('div');
    div.className = 'product-card';
    div.innerHTML = `
      <div class="product-image">Image placeholder<br>${p.name}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-price">${p.price}</div>
    `;
    shopTrack.appendChild(div);
  });

  // ---- Shop drawer toggle ----
  const shopDrawer = document.getElementById('shopDrawer');
  document.getElementById('shopBtn').addEventListener('click', () => {
    shopDrawer.classList.add('open');
    document.getElementById('shopBtn').classList.add('active');
  });
  document.getElementById('closeShopBtn').addEventListener('click', () => {
    shopDrawer.classList.remove('open');
    document.getElementById('shopBtn').classList.remove('active');
  });

  // ---- Cart Demo For Future ---- //
  let cartCount = 0;
  const cartCountEl = document.querySelector('.cart-count');
  document.querySelectorAll('.product-image').forEach(img => {
    img.addEventListener('click', () => {
      cartCount++;
      cartCountEl.textContent = cartCount;
    });
  });
</script>

</body>
</html>
